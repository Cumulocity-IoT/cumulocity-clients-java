# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
version: 2

registries:
  c8y-public: # Define access for a private registry
    type: "maven-repository"
    url: "https://nexus.dev.c8y.io/repository/public"
    username: "${{secrets.C8Y_MVN_PUBLIC_USERNAME}}"
    password: "${{secrets.C8Y_MVN_PUBLIC_PASSWORD}}"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Europe/Berlin"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "00:00"
      timezone: "Europe/Berlin"

  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      time: "00:00"
      timezone: "Europe/Berlin"
    registries:
      - "c8y-public"
    open-pull-requests-limit: 15
    cooldown: # Number of days to wait before raising a PR for a new version
      default-days: 5
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7
      include:
        - "*"
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]   # Ignore all patch updates
      - dependency-name: "org.springframework.boot:*"
        versions: [ ">=4.0.0" ]
